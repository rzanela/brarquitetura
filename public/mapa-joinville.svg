<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo papel -->
  <rect width="800" height="480" fill="#E8EBEE"/>

  <!-- Malha de quadras urbanas estilizadas (Editorial) -->
  <g stroke="#D2D7DD" stroke-width="1.5" opacity="0.65">
    <!-- Ruas horizontais -->
    <line x1="0" y1="80" x2="800" y2="80" stroke-dasharray="4 4"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke-width="2.5" stroke="#BCC3CB"/> <!-- Eixo Rua Lages -->
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke-dasharray="4 4"/>

    <!-- Ruas verticais e diagonais -->
    <line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="260" y1="0" x2="260" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480" stroke-width="2.5" stroke="#BCC3CB"/>
    <line x1="540" y1="0" x2="540" y2="480"/>
    <line x1="680" y1="0" x2="680" y2="480"/>
  </g>

  <!-- Blocos de quadras construídas -->
  <rect x="135" y="95" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>
  <rect x="275" y="95" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>
  <rect x="415" y="95" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>
  <rect x="555" y="95" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>

  <rect x="135" y="175" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>
  <rect x="275" y="175" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>
  <rect x="415" y="175" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>
  <rect x="555" y="175" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>

  <rect x="135" y="255" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>
  <rect x="275" y="255" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>
  <rect x="415" y="255" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>
  <rect x="555" y="255" width="110" height="50" fill="#F5F6F7" stroke="#D2D7DD" stroke-width="1"/>

  <!-- Nomes de vias em mono -->
  <text x="20" y="234" font-family="monospace" font-size="11" fill="#555B63" letter-spacing="1">RUA LAGES</text>
  <text x="408" y="460" font-family="monospace" font-size="11" fill="#555B63" letter-spacing="1" transform="rotate(-90 408 460)">AV. CORONEL PROCÓPIO GOMES</text>

  <!-- Ponto de Marcação: Rua Lages, 743 (Pin Editorial) -->
  <g transform="translate(400, 240)">
    <!-- Círculo pulso suave -->
    <circle r="22" fill="#2868A0" opacity="0.15"/>
    <circle r="14" fill="#2868A0" opacity="0.25"/>
    <!-- Pino de precisão -->
    <circle r="6" fill="#2868A0"/>
    <circle r="2" fill="#F5F6F7"/>
    
    <!-- Caixa de chamada técnica -->
    <rect x="14" y="-34" width="220" height="42" fill="#141619" rx="2"/>
    <text x="24" y="-20" font-family="sans-serif" font-weight="600" font-size="12" fill="#F5F6F7" letter-spacing="0.5">BORGES E ROBLES ARQUITETURA</text>
    <text x="24" y="-6" font-family="monospace" font-size="10" fill="#D2D7DD" letter-spacing="1">RUA LAGES, 743 · JOINVILLE/SC</text>
  </g>

  <!-- Coordenadas Geográficas no rodapé do mapa -->
  <text x="24" y="456" font-family="monospace" font-size="11" fill="#141619" letter-spacing="1.5">26°18'16.2" S  48°50'55.3" W · CLIQUE PARA ABRIR NO GOOGLE MAPS ↗</text>
</svg>

